services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ftp
      POSTGRES_PASSWORD: ftp
      POSTGRES_DB: faculty_testing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ftp:ftp@db:5432/faculty_testing
      SECRET_KEY: change-me-in-production-0123456789abcdef
      ADMIN_USERNAME: ADMIN
      ADMIN_PASSWORD: admin123
      VIDEO_STORAGE_PATH: /storage/recordings
      CORS_ORIGINS: http://localhost:5175,http://127.0.0.1:5175
    volumes:
      - recordings:/storage/recordings
    ports:
      - "8100:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5175:80"
    depends_on:
      - backend

volumes:
  pgdata:
  recordings:
